name: Build and release

on:
  push:
    branches: ["main"]
    tags:
      - '*'
  workflow_dispatch:
jobs:
  build-freebsd:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: taiki-e/install-action@cross
      - run: cross build --target x86_64-unknown-freebsd --release
      - run: cross build --release


