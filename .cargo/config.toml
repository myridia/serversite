# Cross-compilation linkers for release builds.
# Install toolchains:
#   Linux → apt install gcc-x86-64-linux-gnu
#   FreeBSD → apt install gcc-x86-64-unknown-freebsd
#   Windows → apt install gcc-mingw-w64-x86-64

[target.x86_64-unknown-freebsd]
linker = "x86_64-unknown-freebsd-gcc"

[target.x86_64-pc-windows-gnu]
linker = "x86_64-w64-mingw32-gcc"
